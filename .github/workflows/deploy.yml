name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject reset password hash
        env:
          RESET_PASSWORD_HASH: ${{ secrets.RESET_PASSWORD_HASH }}
        run: |
          test -n "$RESET_PASSWORD_HASH" || { echo "Falta el secret RESET_PASSWORD_HASH"; exit 1; }
          sed -i "s/__RESET_PASSWORD_HASH__/$RESET_PASSWORD_HASH/" js/leaderboard.js
          grep -q "$RESET_PASSWORD_HASH" js/leaderboard.js

      - name: Prepare site
        run: |
          mkdir _site
          cp -r index.html style.css js assets _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
